services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webgis_hanoi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/frontend:ro
      - ./data:/app/data
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/data/webgis.db
      - HANOI_BOUNDARY_PATH=/app/data/boundaries/hanoi.geojson
      - TEMP_DIR=/app/data/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Nginx container (phục vụ giao diện và reverse proxy tới backend)
  frontend:
    image: nginx:alpine
    container_name: webgis_hanoi_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
